<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다시봄 — 단원 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 색·크기 기준은 PROJECT_MASTER 16-1 */
:root{
  --paper:#FFF9EA;   /* 전체 배경 */
  --card:#FFFFFF;    /* 학습 카드 */
  --ink:#1D2B3A;     /* 기본 글자 */
  --ink2:#4A5A69; --ink3:#7C8A96;
  --key:#173A63;     /* 핵심 버튼·테두리·현재 단계 */
  --green:#27846C;   /* 현재 개념·선택 상태 */
  --gbg:#EAF6F1;     /* 개념 구조 영역 */
  --gold:#F4C95D;    /* 질문·인출 단서 */
  --goldbg:#FFF3C9;  /* 연한 질문 영역 */
  --goldink:#7A5A12;
  --line:#E0DCCB; --line2:#C4CDD6;
  --red:#A9382F; --redbg:#F8E7E4;
  --hl:#FFF0A8;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Pretendard','SUIT','IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
  font-size:19px;line-height:1.7;-webkit-text-size-adjust:100%;}
h1,h2,h3{font-family:'Noto Serif KR',serif;margin:0;font-weight:500;line-height:1.35;}
.wrap{max-width:1280px;margin:0 auto;padding:26px 40px 96px;}
.measure{max-width:760px;}

/* 과목 탭 — 개념보다 커 보이지 않게 */
.subj{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.subj button{padding:7px 15px;border:1.4px solid var(--line2);background:var(--card);
  border-radius:999px;font-family:inherit;font-size:15px;color:var(--ink2);cursor:pointer;}
.subj button[aria-pressed="true"]{border-color:var(--key);color:var(--key);font-weight:600;}

/* 네 단계 — 원형 번호 + 단계명 */
.steps{display:flex;gap:4px;justify-content:center;max-width:620px;margin:0 auto 26px;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;padding:3px 2px;cursor:pointer;font-family:inherit;}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--card);
  border:1.5px solid var(--line2);color:var(--ink2);font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:.15s;}
.step .nm{font-size:13px;color:var(--ink2);letter-spacing:-.02em;}
.step[aria-current="true"] .num{background:var(--key);border-color:var(--key);color:#fff;}
.step[aria-current="true"] .nm{color:var(--key);font-weight:600;}
.step:hover .num{border-color:var(--key);}
.step:focus-visible,.subj button:focus-visible{outline:2px solid var(--green);outline-offset:3px;}

.deck{overflow:hidden;}
.rail{display:flex;align-items:flex-start;
  transition:transform .3s cubic-bezier(.4,0,.2,1), height .28s ease;}
.pane{flex:0 0 100%;min-width:100%;}
@media (prefers-reduced-motion: reduce){.rail{transition:none;}}

.hd{max-width:1100px;margin:0 auto 18px;}
.hd h1{font-size:30px;margin-top:6px;}
.hd p{font-size:17px;color:var(--ink2);margin:9px 0 0;max-width:780px;}

/* 위계형 지도 */
.mapbox{max-width:1200px;margin:0 auto;}
.chart{overflow-x:auto;padding:6px 0 14px;-webkit-overflow-scrolling:touch;}
.chart::-webkit-scrollbar{height:7px;}
.chart::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;}
.tree ul{display:flex;justify-content:safe center;position:relative;padding:22px 0 0;margin:0;}
.tree li{list-style:none;position:relative;padding:22px 6px 0;text-align:center;}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;
  border-top:2px solid var(--line2);width:50%;height:22px;}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line2);}
.tree li:only-child{padding-top:0;}
.tree li:only-child::after,.tree li:only-child::before{display:none;}
.tree li:first-child::before,.tree li:last-child::after{border:0 none;}
.tree li:last-child::before{border-right:2px solid var(--line2);border-radius:0 8px 0 0;}
.tree li:first-child::after{border-radius:8px 0 0 0;}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;
  border-left:2px solid var(--line2);width:0;height:22px;}
.tree>ul{padding-top:0;}
.nd{display:inline-block;border:1.5px solid var(--line2);background:var(--card);
  border-radius:12px;padding:11px 15px;font-family:inherit;font-size:18px;
  color:var(--ink);cursor:pointer;white-space:nowrap;transition:.15s;}
.nd:hover{border-color:var(--green);}
.nd:focus-visible{outline:2px solid var(--green);outline-offset:3px;}
.nd.root{background:var(--card);color:var(--key);border:2px solid var(--key);
  font-family:'Noto Serif KR',serif;font-size:26px;padding:13px 26px;cursor:default;}
.nd.on{background:var(--gbg);border-color:var(--green);color:var(--green);font-weight:600;}
.nd.leaf{background:var(--gbg);border-color:#CFE5DC;font-size:17px;padding:9px 12px;cursor:default;}
.nd .plus{color:var(--ink3);font-size:15px;margin-left:6px;}
.nd.on .plus{color:var(--green);}
.rootline{text-align:center;font-size:17px;color:var(--ink2);margin:12px 0 4px;}
.rootline b{color:var(--ink);}

/* 개념 고르기 */
.pick{display:flex;gap:8px;flex-wrap:wrap;max-width:1100px;margin:0 auto 16px;}
.pick button{border:1.5px solid var(--line2);background:var(--card);border-radius:999px;
  padding:9px 17px;font-family:inherit;font-size:16px;cursor:pointer;color:var(--ink2);}
.pick button[aria-pressed="true"]{background:var(--gbg);border-color:var(--green);
  color:var(--green);font-weight:600;}
.pick button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--green);margin-left:7px;vertical-align:middle;}

/* 학습 카드 */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  padding:34px 38px;margin:0 auto 16px;max-width:1100px;}
.card.main{min-height:660px;}
.cname{font-family:'Noto Serif KR',serif;font-size:42px;line-height:1.25;margin:0 0 4px;}
.card h2{font-size:26px;margin-bottom:6px;}
.qbox{background:var(--goldbg);border-left:4px solid var(--gold);border-radius:12px;
  padding:20px 24px;margin:16px 0 24px;}
.qbox .tag{display:block;font-size:14px;letter-spacing:.1em;color:var(--goldink);
  font-weight:600;margin-bottom:7px;}
.qbox .qq{font-family:'Noto Serif KR',serif;font-size:28px;color:var(--key);line-height:1.4;}
.lead{font-size:22px;line-height:1.75;max-width:780px;}
.mission{background:var(--gbg);border-radius:12px;padding:17px 20px;font-size:18px;
  color:var(--ink);margin-bottom:18px;line-height:1.75;max-width:820px;}
.mission .tag{display:block;font-weight:600;font-size:14px;letter-spacing:.08em;
  color:var(--green);margin-bottom:6px;}

.slots{display:flex;flex-direction:column;gap:14px;max-width:780px;}
.slot .lb{font-size:16px;color:var(--ink2);margin-bottom:6px;font-weight:500;}
.slot .lb.strong{font-weight:600;font-size:17px;color:var(--ink);}
.slot input{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:13px 15px;
  font-family:inherit;font-size:18px;background:var(--paper);color:var(--ink);}
.slot input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}

.answer{font-size:23px;line-height:2.1;margin-top:6px;max-width:820px;}
.answer .hl{background:linear-gradient(transparent 55%, var(--hl) 55%);padding:0 3px;font-weight:600;}
.subblock{margin-top:20px;max-width:820px;}
.subblock .st{font-size:17px;font-weight:600;color:var(--green);}
.subblock .sd{font-size:20px;line-height:1.8;margin-top:4px;}
.mine{font-size:16px;color:var(--ink2);margin-top:9px;line-height:1.6;}
.mine b{color:var(--ink);font-weight:500;}

.hanja{display:flex;gap:12px;margin-top:22px;max-width:620px;}
.htile{flex:1;text-align:center;border:1.5px solid var(--line2);border-radius:12px;
  padding:15px 8px;background:var(--paper);}
.htile .ch{font-family:'Noto Serif KR',serif;font-size:30px;}
.htile .mn{font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.5;}
.hnote{font-size:17px;color:var(--ink);margin-top:11px;line-height:1.8;max-width:780px;}
.row{display:flex;gap:12px;margin-top:16px;font-size:18px;max-width:780px;}
.row .k{flex:0 0 52px;color:var(--ink2);font-weight:500;}
.loop{background:var(--goldbg);border-left:4px solid var(--gold);border-radius:11px;
  padding:15px 18px;margin-top:20px;font-size:18px;color:var(--ink);max-width:820px;}
.loop .tag{display:block;font-weight:600;font-size:14px;letter-spacing:.08em;
  color:var(--goldink);margin-bottom:5px;}

/* 여섯 단계 카드 */
.six{display:flex;gap:6px;margin:4px 0 26px;flex-wrap:wrap;}
.sixb{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:none;padding:4px 0;cursor:pointer;font-family:inherit;}
.sixb .n{width:36px;height:36px;border-radius:50%;background:var(--card);
  border:1.6px solid var(--line2);color:var(--ink2);font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;}
.sixb .l{font-size:15px;color:var(--ink2);}
.sixb[aria-current="true"] .n{background:var(--green);border-color:var(--green);color:#fff;}
.sixb[aria-current="true"] .l{color:var(--green);font-weight:600;}
.sixb.seen .n{border-color:var(--green);color:var(--green);}
.sixb:focus-visible{outline:2px solid var(--green);outline-offset:3px;}
.stept{font-family:'Noto Serif KR',serif;font-size:26px;margin-bottom:14px;}
.watch{background:var(--paper);border:1.5px dashed var(--line2);border-radius:12px;
  padding:16px 19px;font-size:18px;line-height:1.75;margin-bottom:18px;max-width:820px;}
.watch .tag{display:block;font-size:14px;font-weight:600;letter-spacing:.08em;
  color:var(--ink2);margin-bottom:5px;}
.ask{font-size:20px;line-height:1.75;margin:18px 0 12px;max-width:780px;}
.namebox{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 18px;}
.ntile{flex:1;min-width:210px;background:var(--gbg);border-radius:13px;padding:18px 20px;}
.ntile .nn{font-family:'Noto Serif KR',serif;font-size:24px;color:var(--green);}
.ntile .nd2{font-size:17px;color:var(--ink);margin-top:6px;line-height:1.6;}
.ntile .nmine{font-size:15px;color:var(--ink2);margin-top:9px;}
.struct{background:var(--gbg);border-radius:14px;padding:22px 24px;margin:6px 0 18px;}
.stable{width:100%;border-collapse:collapse;font-size:19px;}
.stable th,.stable td{text-align:left;padding:11px 10px;border-bottom:1px solid #CFE5DC;}
.stable th{font-size:15px;color:var(--green);font-weight:600;letter-spacing:.04em;}
.stable td:first-child{font-weight:600;white-space:nowrap;}
.stable tr:last-child td{border-bottom:none;}
.fig{margin:8px 0 0;overflow-x:auto;}
.fig svg{width:100%;height:auto;display:block;}
.tscroll{overflow-x:auto;}
.swipehint{display:none;font-size:14px;color:var(--ink3);margin-top:6px;}
.figcap{font-size:15px;color:var(--ink2);margin-top:8px;}
.note{font-size:18px;line-height:1.8;margin-top:16px;max-width:800px;}
.note.warn{background:var(--goldbg);border-left:4px solid var(--gold);border-radius:11px;
  padding:15px 18px;}
.ox{border:1.5px solid var(--line2);border-radius:13px;padding:20px 22px;margin-bottom:14px;max-width:860px;}
.ox .oq{font-size:20px;line-height:1.7;margin-bottom:14px;}
.oxb{display:flex;gap:10px;}
.oxb button{flex:0 0 110px;border:1.5px solid var(--line2);background:var(--card);
  border-radius:10px;padding:11px;font-family:inherit;font-size:18px;cursor:pointer;color:var(--ink);}
.oxb button:hover:not(:disabled){border-color:var(--key);}
.oxb button:disabled{cursor:default;}
.oxb button.pickedok{border-color:var(--green);background:var(--gbg);color:var(--green);font-weight:600;}
.oxb button.pickedno{border-color:var(--red);background:var(--redbg);color:var(--red);}
.oxw{margin-top:14px;background:var(--gbg);border-radius:11px;padding:15px 18px;
  font-size:18px;line-height:1.8;}
.case{border:1.5px solid var(--line2);border-radius:13px;padding:20px 22px;margin-bottom:14px;max-width:860px;}
.case .cq{font-size:20px;line-height:1.7;margin-bottom:12px;}
.case textarea{min-height:74px;}
.case .ca{margin-top:14px;background:var(--gbg);border-radius:11px;padding:15px 18px;
  font-size:18px;line-height:1.8;}
.cues{margin:14px 0 0;padding:0;list-style:none;max-width:820px;}
.cues li{background:var(--goldbg);border-radius:11px;padding:13px 17px;margin-bottom:9px;
  font-size:19px;color:var(--ink);}
.sixnav{display:flex;gap:10px;margin-top:26px;max-width:520px;}

textarea{width:100%;min-height:130px;border:1.5px solid var(--line2);border-radius:12px;
  padding:15px;font-family:inherit;font-size:19px;line-height:1.75;resize:vertical;
  background:var(--paper);color:var(--ink);}
textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}

.band{border-radius:13px;padding:20px 22px;margin-bottom:14px;max-width:1100px;}
.band.pass{background:var(--gbg);border-left:4px solid var(--green);}
.band.partial{background:var(--goldbg);border-left:4px solid var(--gold);}
.band.alert{background:var(--redbg);border-left:4px solid var(--red);}
.band .v{font-family:'Noto Serif KR',serif;font-size:22px;margin-bottom:8px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.chip{font-size:15px;border-radius:999px;padding:5px 13px;border:1.5px solid;background:#fff;}
.chip.have{color:var(--green);border-color:var(--green);}
.chip.miss{color:var(--ink2);border-color:var(--ink3);}
.spin{text-align:center;color:var(--ink2);font-size:18px;padding:40px 0;}
.prev{background:var(--paper);border:1.5px dashed var(--line2);border-radius:12px;
  padding:16px 19px;margin:0 auto 14px;max-width:1100px;font-size:18px;line-height:1.8;}
.prev .tag{display:block;font-size:14px;letter-spacing:.08em;color:var(--ink2);
  font-weight:600;margin-bottom:6px;}

/* 확인 문항 */
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:28px 32px;margin:0 auto 14px;max-width:1100px;}
.qcard .no{display:flex;align-items:baseline;gap:11px;margin-bottom:12px;}
.qcard .no .num{font-family:'Noto Serif KR',serif;font-size:19px;color:var(--key);font-weight:600;}
.qcard .no .unit{font-size:15px;font-weight:600;color:var(--green);
  background:var(--gbg);border-radius:999px;padding:3px 12px;}
.qcard .txt{font-size:21px;font-weight:500;margin-bottom:16px;line-height:1.75;max-width:820px;}
.opt{display:block;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line2);border-radius:11px;padding:14px 17px;margin-bottom:9px;
  font-family:inherit;font-size:18px;cursor:pointer;color:var(--ink);line-height:1.6;max-width:860px;}
.opt:hover:not(:disabled){border-color:var(--key);}
.opt:disabled{cursor:default;}
.opt.ok{border-color:var(--green);background:var(--gbg);}
.opt.no{border-color:var(--red);background:var(--redbg);}
.fb{border-radius:11px;padding:16px 18px;font-size:18px;margin-top:6px;line-height:1.8;max-width:860px;}
.fb.ok{background:var(--gbg);border-left:4px solid var(--green);}
.fb.no{background:var(--redbg);border-left:4px solid var(--red);}
.fb .tag{display:block;font-size:14px;font-weight:600;letter-spacing:.06em;margin-bottom:6px;}
.fb.ok .tag{color:var(--green);} .fb.no .tag{color:var(--red);}
.lblwhy{font-size:16px;color:var(--green);font-weight:600;margin:16px 0 7px;}
.done{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:28px;text-align:center;max-width:1100px;margin:0 auto;}
.done h2{font-size:23px;margin-bottom:9px;}
.done p{font-size:18px;color:var(--ink2);margin:0;}

.nav{display:flex;gap:10px;margin:22px auto 0;max-width:1100px;}
.btn{background:var(--key);color:#fff;border:1.6px solid var(--key);
  border-radius:11px;padding:14px 22px;font-family:inherit;font-size:17px;cursor:pointer;}
.btn.wide{flex:1;}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line2);}
.btn.ghost:hover{border-color:var(--key);color:var(--key);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:3px;}
.err{color:var(--red);font-size:16px;margin-top:10px;}

/* 작은 노트북 */
@media (max-width:1200px){
  body{font-size:18px;}
  .wrap{padding:22px 28px 84px;}
  .card{padding:28px 30px;}
  .cname{font-size:36px;}
  .qbox .qq{font-size:25px;}
  .lead{font-size:20px;}
  .nd{font-size:17px;} .nd.root{font-size:23px;}
}
/* 태블릿·휴대폰 */
@media (max-width:820px){
  body{font-size:16px;}
  .wrap{padding:16px 16px 72px;}
  .card,.qcard{padding:22px 18px;border-radius:14px;}
  .card.main{min-height:0;}
  .cname{font-size:29px;}
  .qbox{padding:16px 17px;} .qbox .qq{font-size:21px;}
  .lead{font-size:18px;} .hd h1{font-size:24px;}
  .step .num{width:26px;height:26px;font-size:12px;} .step .nm{font-size:12px;}
  .sixb{min-width:74px;} .sixb .l{font-size:13px;}
  .nd{font-size:16px;padding:9px 11px;} .nd.root{font-size:20px;padding:11px 18px;}
  .stept{font-size:22px;} .answer{font-size:19px;}
  .ntile{min-width:100%;}
  .stable{font-size:17px;min-width:430px;}
  .fig svg{min-width:560px;}
  .swipehint{display:block;}
  .nav{flex-wrap:wrap;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="subj" id="subj"></div>

  <div class="steps" id="steps">
    <button class="step" aria-current="true" onclick="go(0)"><span class="num">1</span><span class="nm">개념 지도</span></button>
    <button class="step" onclick="go(1)"><span class="num">2</span><span class="nm">개념 읽기</span></button>
    <button class="step" onclick="go(2)"><span class="num">3</span><span class="nm">개념 말하기</span></button>
    <button class="step" onclick="go(3)"><span class="num">4</span><span class="nm">개념 확인하기</span></button>
  </div>

  <div class="deck"><div class="rail" id="rail">

    <section class="pane">
      <div class="hd"><h1 id="mapTitle"></h1></div>
      <div class="mapbox">
        <div class="chart"><div class="tree" id="tree"></div></div>
      </div>
      <div class="nav"><button class="btn" onclick="go(1)">개념 읽으러 →</button></div>
    </section>

    <section class="pane">
      <div class="hd"><p id="concLead"></p></div>
      <div class="pick" id="pick"></div>
      <div id="conc"></div>
      <div class="nav" id="concNav">
        <button class="btn ghost" onclick="go(0)">← 지도</button>
        <button class="btn" onclick="go(2)">개념 말하러 →</button>
      </div>
    </section>

    <section class="pane">
      <div class="hd">
        <h1 id="selfTitle"></h1>
        <p>교과서 문장을 옮기지 말고, 질문에 답하듯 두세 문장으로 쓰세요.</p>
      </div>
      <div id="selfBox"></div>
      <div class="nav">
        <button class="btn ghost" onclick="go(1)">← 개념</button>
        <button class="btn" onclick="go(3)">확인하러 →</button>
      </div>
    </section>

    <section class="pane">
      <div class="hd">
        <h1 id="quizTitle">개념 확인하기</h1>
        <p>모두 <span id="qN"></span>문제. 맞히려고가 아니라 <b>어디가 흔들리는지 보려고</b> 푸는 문제예요.</p>

    { unit: "힘의 표현", why: true,
      t: "오른쪽으로 굴러가던 공이 점점 느려지다 멈췄습니다. 공에 작용한 마찰력의 방향은?",
      o: [
        { s: "오른쪽", ok: false, w: "힘의 방향과 물체가 움직이는 방향을 같다고 본 것입니다. 힘이 오른쪽이었다면 공은 더 <b>빨라졌어야</b> 합니다." },
        { s: "왼쪽", ok: true, w: "미끄러지려는 방향의 반대로 작용해서 공이 느려졌습니다." }
      ]},

    { unit: "힘과 운동",
      t: "엘리베이터가 <b>일정한 속력으로</b> 올라가고 있습니다. 이때 합력은?",
      o: [
        { s: "위쪽으로 0이 아니다", ok: false, w: "움직이려면 힘이 계속 필요하다는 생각입니다. 속력이 변하지 않으면 합력은 0입니다. 힘은 운동을 <b>변화시킬 때</b> 필요합니다." },
        { s: "0이다", ok: true, w: "정지뿐 아니라 속력이 일정한 운동도 평형 상태입니다." },
        { s: "아래쪽으로 0이 아니다", ok: false, w: "그렇다면 엘리베이터가 점점 느려졌을 것입니다." },
        { s: "위로 갈 때는 0, 내려올 때는 0이 아니다", ok: false, w: "방향과 상관없이, 속력이 변하지 않으면 합력은 0입니다." }
      ]}
  ]
};

</script>
<script>
/* ===== 상태 ===== */
window.UNITS = window.UNITS || {};
const KEYS = Object.keys(window.UNITS);
if(!KEYS.length){
  document.body.innerHTML =
    '<div style="max-width:560px;margin:60px auto;padding:24px;font-family:sans-serif;'+
    'border:1.5px solid #C4CDD6;border-radius:14px;background:#fff;line-height:1.8">'+
    '<b>단원 데이터를 불러오지 못했습니다.</b><br>'+
    'app 폴더에서 <code>python3 build_app.py</code> 를 실행해 index.html 을 다시 만들어 주세요.</div>';
  throw new Error("no unit data");
}
let SK = KEYS[0];              // 현재 과목 키
const U = () => window.UNITS[SK];
let stage = 0, ci = 0;
let OPEN = {};                 // OPEN[과목] = Set("0","0.1",…) — 학생이 연 노드가 쌓인다

/* 학습 기록 — HANDOVER 8장 스키마 */
let REC = {};                  // REC[과목][개념명] = {상태, 자기설명[], 오답[], 틀린횟수}
let mem = {};
const rec = (name) => {
  REC[SK] = REC[SK] || {};
  REC[SK][name] = REC[SK][name] || { state:"", explains:[], wrongs:[], missCount:0 };
  return REC[SK][name];
};
async function save(){
  const p = JSON.stringify(REC);
  try { await window.storage.set("sayitback:record", p); } catch(e){ mem.rec = p; }
}
async function load(){
  try { const r = await window.storage.get("sayitback:record"); if(r&&r.value) REC = JSON.parse(r.value); }
  catch(e){ if(mem.rec) REC = JSON.parse(mem.rec); }
}
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const today = () => new Date().toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"});

/* ===== 과목 탭 ===== */
function drawSubj(){
  const el = document.getElementById("subj");
  if(KEYS.length < 2){ el.style.display = "none"; return; }   /* 과목이 하나면 탭을 그리지 않는다 */
  el.style.display = "";
  el.innerHTML = KEYS.map(k=>
    `<button aria-pressed="${k===SK}" onclick="switchSubj('${k}')">${window.UNITS[k].subject} · ${window.UNITS[k].unit}</button>`).join("");
}
function switchSubj(k){
  SK = k; ci = 0; A = []; W = []; diagState = null;
  drawAll(); go(0);
}

/* ===== 단계 ===== */
function go(i){
  stage = i;
  document.getElementById("rail").style.transform = `translateX(-${i*100}%)`;
  document.querySelectorAll(".step").forEach((b,j)=>b.setAttribute("aria-current", j===i));
  if(i===2) drawSelf();
  syncH();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* 네 화면이 한 줄에 붙어 있어서, 레일 높이를 지금 보고 있는 화면에 맞춘다.
   맞추지 않으면 가장 긴 화면(확인 문항) 높이만큼 아래가 비어 보인다. */
let hTick = 0;
function syncH(){
  cancelAnimationFrame(hTick);
  hTick = requestAnimationFrame(()=>{
    const pane = document.querySelectorAll(".pane")[stage];
    if(pane) document.getElementById("rail").style.height = pane.offsetHeight + "px";
  });
}

/* ===== 트리 =====
   누르기 전에 짐작하도록 접힌 채로 시작하되, 연 갈래는 닫히지 않고 쌓인다.
   하나씩 열다 보면 마지막에는 단원 전체가 한 화면에 남는다. 다시 누르면 그 갈래만 접힌다. */
const open = () => (OPEN[SK] = OPEN[SK] || new Set());
function drawTree(){
  const T = U().tree, O = open();
  const node = (k, id) => {
    if(!k.kids || !k.kids.length)                       /* 자식이 없으면 층과 상관없이 말단 */
      return `<li><span class="nd leaf">${k.label}</span></li>`;
    const on = O.has(id);
    const sub = on ? `<ul>${k.kids.map((c,j)=>node(c, id+"."+j)).join("")}</ul>` : "";
    return `<li><button class="nd ${on?'on':''}" onclick="tg('${id}')">${k.label}<span class="plus">${on?'−':'+'}</span></button>${sub}</li>`;
  };
  document.getElementById("tree").innerHTML =
    `<ul><li><span class="nd root">${T.label}</span><div class="rootline">${T.line}</div><ul>${T.kids.map((k,i)=>node(k,String(i))).join("")}</ul></li></ul>`;
}
function tg(id){
  const O = open();
  if(O.has(id)){                                        /* 접을 때는 그 아래 열림도 함께 정리 */
    for(const x of [...O]) if(x===id || x.startsWith(id+".")) O.delete(x);
  } else O.add(id);
  drawTree();
}

    <circle cx="230" cy="326" r="6" fill="#27846C"/>
    <text x="352" y="332" font-size="17" fill="#1D2B3A">2 N</text>
    <line x1="230" y1="368" x2="422" y2="368" stroke="#173A63" stroke-width="5" marker-end="url(#ah)"/>
    <circle cx="230" cy="368" r="6" fill="#27846C"/>
    <text x="452" y="374" font-size="17" fill="#1D2B3A">4 N</text>
  </g>
</svg>`
};

/* ===== 개념 ===== */
let filled = {};

function drawConc(){
  const u = U(), C = u.concepts, c = C[ci];
  document.getElementById("pick").innerHTML = C.map((x,i)=>{
    const k = SK+":"+x.n;
    const on = x.card==="six" ? (SIX[k] && SIX[k].i>=x.steps.length-1) : !!filled[k];
    return `<button aria-pressed="${i===ci}" onclick="pickC(${i})">${x.short}${on?'<span class="dot"></span>':''}</button>`;
  }).join("");

  document.getElementById("conc").innerHTML =
    (c.card === "six") ? sixCard(u,c) : plainCard(u,c);
  const nav = document.getElementById("concNav");
  if(nav) nav.style.display = (c.card === "six") ? "none" : "";
}
function pickC(i){ ci = i; drawConc(); }

/* --- 기존 카드(빈칸 → 대조) : 과학 힘의 종류 · 사회 소제목 --- */
function plainCard(u,c){
  const f = filled[SK+":"+c.n];
  const isSlots = u.mode === "slots";
  const fields  = isSlots ? c.slots : c.subs;

  const body = f ? (isSlots ? `
      <div class="answer">${c.slots.map(s=>
        s.hl ? `<span class="hl">${s.v}</span>` : s.v).join(" · ")}</div>
      <div class="mine">내가 쓴 것 — ${c.slots.map((s,j)=>`<b>${esc(f[j])||"(빈칸)"}</b>`).join(" · ")}</div>
      <div class="row"><span class="k">크기</span><span>${c.size}</span></div>
    ` : `
      ${c.subs.map((s,j)=>`<div class="subblock">
        <div class="st">${s.t}</div>
        <div class="sd">${s.d}</div>
        <div class="mine">내가 쓴 것 — <b>${esc(f[j])||"(빈칸)"}</b></div>
      </div>`).join("")}
    `) + `
    ${c.hanja?`<div class="hanja">${c.hanja.map(h=>`<div class="htile"><div class="ch">${h.c}</div><div class="mn">${h.m}</div></div>`).join("")}</div>
      <div class="hnote">${c.hnote}</div>`:""}
    <div class="loop"><span class="tag">맨 위로 돌아가기</span>${c.loop}</div>
    <div class="nav"><button class="btn ghost" onclick="resetC()">다시 채우기</button></div>
  ` : `
    <div class="mission"><span class="tag">교과서 미션</span>${c.mission}</div>
    <div class="slots">
      ${fields.map((s,j)=>`<div class="slot">
        <div class="lb ${isSlots?'':'strong'}">${isSlots?s.k:s.t}</div>
        <input id="s${j}" placeholder="${isSlots?'':'한두 문장으로'}">
      </div>`).join("")}
    </div>
    <div class="nav"><button class="btn" onclick="fillC()">채웠어요</button></div>
  `;

  return `<div class="card main">
      <h2 class="cname">${c.n}</h2>
      <div class="qbox"><span class="tag">${u.mode==="slots"?"이 개념의 질문":"이 주제의 질문"}</span>
        <div class="qq">${c.trigger}</div></div>
      ${body}
    </div>`;
}
function fillC(){
  const c = U().concepts[ci];
  const n = (U().mode==="slots" ? c.slots : c.subs).length;
  filled[SK+":"+c.n] = Array.from({length:n},(_,j)=>{
    const e = document.getElementById("s"+j); return e ? e.value.trim() : "";
  });
  drawConc();
}
function resetC(){ delete filled[SK+":"+U().concepts[ci].n]; drawConc(); }

/* --- 여섯 단계 카드 (시범: 과학 「힘의 표현」) ---
   장면 → 이름 → 구조 → 비교 → 적용 → 설명. 문제 검증은 4단계가 맡습니다. */
let SIX = {};
function sixS(){
  const k = SK+":"+U().concepts[ci].n;
  SIX[k] = SIX[k] || { i:0, pre:{}, ox:{}, cs:{}, show:{} };
  return SIX[k];
}
function sixGo(i){
  const s = sixS(), n = U().concepts[ci].steps.length;
  s.i = Math.max(0, Math.min(n-1, i));
  drawConc();
  const el = document.querySelector("#conc .card");
  if(el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 16, behavior:"smooth"});
}
function sixPre(j,v){ sixS().pre[j] = v; }
function sixOx(i,v){ sixS().ox[i] = v; drawConc(); }
function sixCs(i,v){ sixS().cs[i] = v; }
function sixShow(i){ sixS().show[i] = true; drawConc(); }

function sixCard(u,c){
  const s = sixS(), st = c.steps[s.i];
  const rail = c.steps.map((x,i)=>
    `<button class="sixb ${i<s.i?'seen':''}" aria-current="${i===s.i}" onclick="sixGo(${i})">
       <span class="n">${i+1}</span><span class="l">${x.k}</span></button>`).join("");

  let body = "";
  if(st.type === "scene"){
    body = `
      <div class="mission"><span class="tag">교과서에서 보기</span>${st.mission}</div>
      <div class="watch"><span class="tag">직접 해 보기</span>${st.watch}</div>
      <div class="ask">${st.ask}</div>
      <div class="slots">${st.ph.map((p,j)=>`<div class="slot">
        <input value="${esc(s.pre[j]||"")}" placeholder="${p}" oninput="sixPre(${j},this.value)">
      </div>`).join("")}</div>`;
  }
  else if(st.type === "name"){
    const mine = Object.keys(s.pre).length ? st.items.map((_,j)=>esc(s.pre[j]||"")) : [];
    body = `
      <div class="namebox">${st.items.map((it,j)=>`<div class="ntile">
        <div class="nn">${it.name}</div><div class="nd2">${it.d}</div>
        <div class="nmine">내가 짐작해 쓴 것 — <b>${mine[j]||"(빈칸)"}</b></div>
      </div>`).join("")}</div>
      <div class="note measure">${st.note}</div>`;
  }
  else if(st.type === "structure"){
    body = `
      <div class="struct">
        <div class="tscroll"><table class="stable">
          <tr><th>힘에서 무엇을</th><th>화살표의 무엇으로</th><th>어떻게 읽는가</th></tr>
          ${st.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
        </table></div>
        <div class="fig">${FIGS[st.fig] ? FIGS[st.fig]() : ""}</div>
        <div class="figcap">${st.figcap}</div>
        <div class="swipehint">표와 그림은 옆으로 넘겨서 볼 수 있어요.</div>
      </div>
      <div class="note measure">${st.rule}</div>
      <div class="note warn measure">${st.caution}</div>`;
  }
  else if(st.type === "compare"){
    body = `<div class="ask">${st.lead}</div>` + st.ox.map((x,i)=>{
      const p = s.ox[i];
      const cls = v => p===undefined ? "" : (p===v ? (v===x.a ? "pickedok" : "pickedno") : "");
      return `<div class="ox">
        <div class="oq">${x.q}</div>
        <div class="oxb">
          <button class="${cls(true)}" ${p!==undefined?"disabled":""} onclick="sixOx(${i},true)">맞다</button>
          <button class="${cls(false)}" ${p!==undefined?"disabled":""} onclick="sixOx(${i},false)">아니다</button>
        </div>
        ${p!==undefined?`<div class="oxw">${x.w}</div>`:""}
      </div>`;
    }).join("");
  }
  else if(st.type === "apply"){
    body = `<div class="ask">${st.lead}</div>` + st.cases.map((x,i)=>`
      <div class="case">
        <div class="cq">${x.q}</div>
        <textarea placeholder="${x.ph}" oninput="sixCs(${i},this.value)">${esc(s.cs[i]||"")}</textarea>
        ${s.show[i] ? `<div class="ca">${x.a}</div>`
                    : `<div class="nav" style="margin-top:12px"><button class="btn ghost" onclick="sixShow(${i})">쓴 뒤에 맞춰 보기</button></div>`}
      </div>`).join("");
  }
  else if(st.type === "express"){
    body = `
      <div class="ask">${st.say}</div>
      <ul class="cues">${st.cues.map(q=>`<li>${q}</li>`).join("")}</ul>
      <div class="note measure">${st.next}</div>
      <div class="loop"><span class="tag">맨 위로 돌아가기</span>${c.loop}</div>
      <div class="nav" style="max-width:340px"><button class="btn" onclick="go(2)">개념 말하러 →</button></div>`;
  }

  return `<div class="card main">
    <h2 class="cname">${c.n}</h2>
    <div class="qbox"><span class="tag">이 개념의 질문</span><div class="qq">${c.trigger}</div></div>
    <div class="six">${rail}</div>
    <div class="stept">${s.i+1}. ${st.t}</div>
    ${body}
    <div class="sixnav">
      <button class="btn ghost wide" ${s.i===0?"disabled":""} onclick="sixGo(${s.i-1})">← 이전</button>
      <button class="btn wide" ${s.i===c.steps.length-1?"disabled":""} onclick="sixGo(${s.i+1})">다음 →</button>
    </div>
  </div>`;
}

/* ===== 내 말로 + 진단 ===== */
let diagState = null;
function drawSelf(){
  const c = U().concepts[ci];
  document.getElementById("selfTitle").textContent = c.short;
  const box = document.getElementById("selfBox");

  if(diagState==="loading"){ box.innerHTML = `<div class="card"><div class="spin">읽고 있어요…</div></div>`; return; }

  if(diagState && diagState.v){
    const d = diagState, lv = d.level==="pass"?"pass":d.level==="alert"?"alert":"partial";
    box.innerHTML = `
      <div class="band ${lv}">
        <div class="v">${esc(d.v)}</div>
        <div style="font-size:18px">${esc(d.comment)}</div>
        <div class="chips">
          ${(d.have||[]).map(h=>`<span class="chip have">${esc(h)} 있음</span>`).join("")}
          ${(d.missing||[]).map(m=>`<span class="chip miss">${esc(m)} 빠짐</span>`).join("")}
        </div>
      </div>
      ${d.followup?`<div class="loop" style="max-width:1100px;margin:0 auto"><span class="tag">다시 생각해 보기</span>${esc(d.followup)}</div>`:""}
      <div class="nav"><button class="btn ghost" onclick="diagState=null;drawSelf()">고쳐 쓰기</button></div>`;
    return;
  }

  /* 이전에 쓴 글이 있으면 나란히 보여 준다 (HANDOVER 8장) */
  const past = rec(c.n).explains;
  const prev = past.length ? `<div class="prev"><span class="tag">${past[past.length-1].date}에 쓴 글</span>
      ${esc(past[past.length-1].text)}</div>` : "";

  box.innerHTML = `
    ${prev}
    <div class="card">
      <div class="qbox"><span class="tag">이 개념의 질문</span><div class="qq">${c.trigger}</div></div>
      <textarea id="ans" placeholder="자기 말로 두세 문장"></textarea>
      <div id="err" class="err"></div>
      <div class="nav"><button class="btn" onclick="diagnose()">진단받기</button></div>
    </div>`;
}

async function diagnose(){
  const t = document.getElementById("ans").value.trim();
  if(t.length < 10){ document.getElementById("err").textContent = "조금만 더 자세히 써 주세요."; return; }
  const u = U(), c = u.concepts[ci];
  diagState = "loading"; drawSelf();

  const spec = c.spec ? c.spec
    : (u.mode==="slots"
      ? `[정답 뼈대] ${c.slots.map(s=>s.v).join(" · ")}\n[크기] ${c.size}\n[필수 요소]\n${c.slots.map(s=>`- ${s.k}: ${s.v}`).join("\n")}`
      : `[이 주제의 질문] ${c.trigger}\n[교과서가 다루는 소제목과 핵심]\n${c.subs.map(s=>`- ${s.t}: ${s.d}`).join("\n")}`);

  const sys = `너는 중학교 1학년 ${u.subject} 개념 진단 전문가다. 학생이 '${c.short}'에 대해 자기 말로 쓴 글을 진단한다.

${spec}

규칙:
1) 필요한 내용이 학생 글에 담겼는지 본다. 표현이 달라도 뜻이 통하면 있는 것으로 본다.
2) 교육과정 수준에서 맞으면 통과시킨다. 교과서보다 엄격하게 채점하지 않는다.
3) 정답 문장을 그대로 알려주지 말고, 스스로 다시 생각하게 하는 사례나 질문을 하나 던진다.
4) 중1이 읽을 수 있는 말로, 잘한 점을 먼저 말한다.

아래 JSON만 출력한다. 코드블록 표시를 넣지 않는다.
{"level":"pass|partial|alert","have":["담긴 내용"],"missing":["빠진 내용"],"v":"한 문장 총평","comment":"두세 문장 피드백","followup":"질문 한 개"}`;

  try{
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000,
        messages:[{role:"user", content: sys + "\n\n[학생의 글]\n" + t}] })});
    const j = await r.json();
    const raw = j.content.filter(x=>x.type==="text").map(x=>x.text).join("").replace(/```json|```/g,"").trim();
    diagState = JSON.parse(raw);
  }catch(e){
    diagState = null; drawSelf();
    const el = document.getElementById("err");
    if(el) el.textContent = "진단을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.";
    return;
  }

  const R = rec(c.n);
  R.explains.push({ date: today(), text: t, missing: diagState.missing||[], level: diagState.level });
  R.state = diagState.level;
  await save();
  drawSelf();
}

/* ===== 확인 문항 ===== */
let A = [], W = [];
function drawQuiz(){
  const Q = U().quiz;
  if(A.length !== Q.length){ A = Array(Q.length).fill(null); W = Array(Q.length).fill(""); }
  document.getElementById("quiz").innerHTML = Q.map((q,i)=>{
    const a = A[i];
    return `<div class="qcard"><div class="no"><span class="num">${i+1}</span><span class="unit">${q.unit}</span></div><div class="txt">${q.t}</div>
      ${q.o.map((o,j)=>{ let c="opt"; if(a!==null){ if(o.ok) c+=" ok"; else if(a===j) c+=" no"; }
        return `<button class="${c}" ${a!==null?"disabled":""} onclick="pk(${i},${j})">${o.s}</button>`;}).join("")}
      ${a!==null?`<div class="fb ${q.o[a].ok?'ok':'no'}"><span class="tag">${q.o[a].ok?"맞았어요":"여기서 갈렸어요"}</span>${q.o[a].w}</div>`:""}
      ${(a!==null && q.why)?`<div class="lblwhy">그렇게 생각한 까닭을 한 줄로 써 보세요</div>
        <textarea id="wy${i}" style="min-height:70px" placeholder="${q.o[a].ok?'왜 그렇게 판단했나요?':'어느 부분이 헷갈렸나요?'}">${esc(W[i])}</textarea>`:""}
    </div>`;}).join("")
    + (A.every(x=>x!==null) ? `<div class="done"><h2>여기까지</h2>
      <p>틀린 것이 있다면 그 카드로 한 번만 돌아가 보세요.<br>본 문제는 이틀 뒤에 종이로 풉니다.</p></div>` : "");
}
async function pk(i,j){
  if(A[i]!==null) return;
  const Q = U().quiz;
  Q.forEach((_,k)=>{ const e = document.getElementById("wy"+k); if(e) W[k] = e.value; });
  A[i] = j;
  if(!Q[i].o[j].ok){
    const R = rec(Q[i].unit);
    R.wrongs.push({ date: today(), q: i+1, picked: Q[i].o[j].s });
    R.missCount = (R.missCount||0) + 1;   /* 2회 이상이면 개입 — HANDOVER 7장 */
    await save();
  }
  drawQuiz();
}

/* ===== 시작 ===== */
function drawAll(){
  const u = U();
  drawSubj();
  document.getElementById("mapTitle").textContent = u.unit;
  document.getElementById("concLead").innerHTML   = u.mode==="slots"
    ? "먼저 짐작해서 쓰고, 교과서로 확인하세요. 틀려도 괜찮습니다."
    : "교과서를 읽고 소제목마다 핵심을 채우세요.";
  document.getElementById("qN").textContent = u.quiz.length;
  drawTree(); drawConc(); drawQuiz();
}
(async ()=>{
  await load(); drawAll(); syncH();
  const ro = new ResizeObserver(syncH);
  document.querySelectorAll(".pane").forEach(p=>ro.observe(p));
  window.addEventListener("resize", syncH);
})();
</script>
