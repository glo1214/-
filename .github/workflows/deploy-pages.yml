name: Deploy to GitHub Pages

# 이 브랜치에 푸시할 때마다 GitHub가 직접 빌드해서 Pages에 배포한다.
# (Netlify 업로드가 세션 egress 정책으로 막혀 있어 GitHub CI로 자동화)
on:
  push:
    branches:
      - claude/vocab-app-v1-build-vh0l06
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (Pages base = /-/)
        env:
          PAGES_BASE: /-/
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# redeploy trigger
